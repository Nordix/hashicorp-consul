# This workflow builds a dev binary and publishes a Docker image on every push to main.
name: build-artifacts

on:
  push:
    branches:
      - main
      - v1.22.7-est
      - update-workflows

permissions:
  contents: read
  packages: write

env:
  # Docker tags must be lowercase
  DOCKER_IMAGE: ghcr.io/nordix/consul

jobs:
  get-go-version:
    uses: ./.github/workflows/reusable-get-go-version.yml

  dev-build-push:
    needs:
      - get-go-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}

      - run: go env

      - name: Build dev binary
        run: make dev

      - name: Set env vars
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "GITHUB_BUILD_URL=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker build and push
        uses: docker/build-push-action@v5
        with:
          context: ./bin
          file: ./build-support/docker/Consul-Dev.dockerfile
          labels: COMMIT_SHA=${{ github.sha }},GITHUB_BUILD_URL=${{ env.GITHUB_BUILD_URL }}
          push: true
          provenance: false
          tags: |
            ${{ env.DOCKER_IMAGE }}-dev:${{ env.SHORT_SHA }}
            ${{ env.DOCKER_IMAGE }}-dev:latest

  build-artifacts-success:
    needs:
      - dev-build-push
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Evaluate upstream job results
        run: |
          if printf '${{ toJSON(needs) }}' | grep -E -i '"result": "(failure|cancelled)"'; then
            printf "Tests failed or workflow cancelled:\n\n${{ toJSON(needs) }}"
            exit 1
          fi
