name: go-tests

on:
  pull_request:
    branches-ignore:
      - stable-website
      - 'docs/**'
      - 'ui/**'
      - 'mktg-**'
      - 'backport/docs/**'
      - 'backport/ui/**'
      - 'backport/mktg-**'
  push:
    branches:
      - main
      - release/**
      - v1.22.7-est
      - update-workflows

permissions:
  contents: read

env:
  TEST_RESULTS: /tmp/test-results

concurrency:
  group: go-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  conditional-skip:
    uses: ./.github/workflows/reusable-conditional-skip.yml

  setup:
    needs: [conditional-skip]
    name: Setup
    if: needs.conditional-skip.outputs.skip-ci != 'true'
    runs-on: ubuntu-latest
    outputs:
      compute-small: ${{ steps.setup-outputs.outputs.compute-small }}
      compute-medium: ${{ steps.setup-outputs.outputs.compute-medium }}
      compute-large: ${{ steps.setup-outputs.outputs.compute-large }}
      compute-xl: ${{ steps.setup-outputs.outputs.compute-xl }}
    steps:
      - uses: actions/checkout@v4
      - id: setup-outputs
        name: Setup outputs
        run: ./.github/scripts/get_runner_classes.sh

  get-go-version:
    uses: ./.github/workflows/reusable-get-go-version.yml

  check-go-mod:
    needs:
      - setup
      - get-go-version
    uses: ./.github/workflows/reusable-check-go-mod.yml
    with:
      runs-on: ${{ needs.setup.outputs.compute-small }}
      repository-name: ${{ github.repository }}
      go-version: ${{ needs.get-go-version.outputs.go-version }}
    secrets:
      elevated-github-token: ${{ secrets.GITHUB_TOKEN }}

  check-generated-protobuf:
    needs:
      - setup
      - get-go-version
    runs-on: ${{ fromJSON(needs.setup.outputs.compute-medium) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}
      - run: make proto-tools
        name: Install protobuf
      - run: make proto-format
        name: "Protobuf Format"
      - run: make --always-make proto
      - run: |
          if ! git diff --exit-code; then
            echo "Generated code was not updated correctly"
            exit 1
          fi
      - run: make proto-lint
        name: "Protobuf Lint"

  check-codegen:
    needs:
      - setup
      - get-go-version
    runs-on: ${{ fromJSON(needs.setup.outputs.compute-large) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}
      - run: make --always-make codegen
      - run: |
          if ! git diff --exit-code; then
            echo "Generated code was not updated correctly"
            exit 1
          fi

  lint-enums:
    needs:
      - setup
      - get-go-version
    runs-on: ${{ fromJSON(needs.setup.outputs.compute-large) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}
      - run: go install github.com/reillywatson/enumcover/cmd/enumcover@master && enumcover ./...

  lint-container-test-deps:
    needs:
      - setup
      - get-go-version
    runs-on: ${{ fromJSON(needs.setup.outputs.compute-small) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}
      - run: make lint-container-test-deps

  lint-consul-retry:
    needs:
      - setup
      - get-go-version
    runs-on: ${{ fromJSON(needs.setup.outputs.compute-small) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}
      - run: make lint-consul-retry

  lint:
    needs:
      - setup
      - get-go-version
    uses: ./.github/workflows/reusable-lint.yml
    with:
      runs-on: ${{ needs.setup.outputs.compute-large }}
      repository-name: ${{ github.repository }}
      go-version: ${{ needs.get-go-version.outputs.go-version }}
    secrets:
      elevated-github-token: ${{ secrets.GITHUB_TOKEN }}

  lint-32bit:
    needs:
      - setup
      - get-go-version
    uses: ./.github/workflows/reusable-lint.yml
    with:
      go-arch: "386"
      runs-on: ${{ needs.setup.outputs.compute-large }}
      repository-name: ${{ github.repository }}
      go-version: ${{ needs.get-go-version.outputs.go-version }}
    secrets:
      elevated-github-token: ${{ secrets.GITHUB_TOKEN }}

  dev-build:
    needs:
      - setup
      - get-go-version
    uses: ./.github/workflows/reusable-dev-build.yml
    with:
      runs-on: ${{ needs.setup.outputs.compute-large }}
      repository-name: ${{ github.repository }}
      go-version: ${{ needs.get-go-version.outputs.go-version }}
    secrets:
      elevated-github-token: ${{ secrets.GITHUB_TOKEN }}

  go-test-ce:
    needs:
      - setup
      - get-go-version
      - dev-build
    uses: ./.github/workflows/reusable-unit-split.yml
    with:
      directory: .
      runner-count: 6
      runs-on: ${{ needs.setup.outputs.compute-large }}
      repository-name: ${{ github.repository }}
      go-tags: ""
      go-version: ${{ needs.get-go-version.outputs.go-version }}
    permissions:
      id-token: write
      contents: read
    secrets:
      elevated-github-token: ${{ secrets.GITHUB_TOKEN }}
      consul-license: ${{ secrets.CONSUL_LICENSE }}
      datadog-api-key: ""

  go-test-race:
    needs:
      - setup
      - get-go-version
      - dev-build
    uses: ./.github/workflows/reusable-unit.yml
    with:
      directory: .
      go-test-flags: "-race -gcflags=all=-d=checkptr=0"
      package-names-command: "go list ./... | grep -E -v '^github.com/hashicorp/consul/agent(/consul|/local|/routine-leak-checker)?$' | grep -E -v '^github.com/hashicorp/consul(/command|/connect|/snapshot)'"
      runs-on: ${{ needs.setup.outputs.compute-large }}
      repository-name: ${{ github.repository }}
      go-tags: ""
      go-version: ${{ needs.get-go-version.outputs.go-version }}
    permissions:
      id-token: write
      contents: read
    secrets:
      elevated-github-token: ${{ secrets.GITHUB_TOKEN }}
      consul-license: ${{ secrets.CONSUL_LICENSE }}
      datadog-api-key: ""

  go-test-32bit:
    needs:
      - setup
      - get-go-version
      - dev-build
    uses: ./.github/workflows/reusable-unit.yml
    with:
      directory: .
      go-arch: "386"
      go-test-flags: "-short"
      runs-on: ${{ needs.setup.outputs.compute-large }}
      repository-name: ${{ github.repository }}
      go-tags: ""
      go-version: ${{ needs.get-go-version.outputs.go-version }}
    permissions:
      id-token: write
      contents: read
    secrets:
      elevated-github-token: ${{ secrets.GITHUB_TOKEN }}
      consul-license: ${{ secrets.CONSUL_LICENSE }}
      datadog-api-key: ""

  go-test-envoyextensions:
    needs:
      - setup
      - get-go-version
      - dev-build
    uses: ./.github/workflows/reusable-unit.yml
    with:
      directory: envoyextensions
      runs-on: ${{ needs.setup.outputs.compute-large }}
      repository-name: ${{ github.repository }}
      go-tags: ""
      go-version: ${{ needs.get-go-version.outputs.go-version }}
    permissions:
      id-token: write
      contents: read
    secrets:
      elevated-github-token: ${{ secrets.GITHUB_TOKEN }}
      consul-license: ${{ secrets.CONSUL_LICENSE }}
      datadog-api-key: ""

  go-test-troubleshoot:
    needs:
      - setup
      - get-go-version
      - dev-build
    uses: ./.github/workflows/reusable-unit.yml
    with:
      directory: troubleshoot
      runs-on: ${{ needs.setup.outputs.compute-large }}
      repository-name: ${{ github.repository }}
      go-tags: ""
      go-version: ${{ needs.get-go-version.outputs.go-version }}
    permissions:
      id-token: write
      contents: read
    secrets:
      elevated-github-token: ${{ secrets.GITHUB_TOKEN }}
      consul-license: ${{ secrets.CONSUL_LICENSE }}
      datadog-api-key: ""

  go-test-api:
    needs:
      - setup
      - get-go-version
      - dev-build
    uses: ./.github/workflows/reusable-unit.yml
    with:
      directory: api
      runs-on: ${{ needs.setup.outputs.compute-large }}
      repository-name: ${{ github.repository }}
      go-tags: ""
      go-version: ${{ needs.get-go-version.outputs.go-version }}
    permissions:
      id-token: write
      contents: read
    secrets:
      elevated-github-token: ${{ secrets.GITHUB_TOKEN }}
      consul-license: ${{ secrets.CONSUL_LICENSE }}
      datadog-api-key: ""

  go-test-api-backwards-compatibility:
    name: go-test-api-${{ needs.get-go-version.outputs.go-version-previous }}
    needs:
      - setup
      - get-go-version
      - dev-build
    uses: ./.github/workflows/reusable-unit.yml
    with:
      directory: api
      runs-on: ${{ needs.setup.outputs.compute-large }}
      repository-name: ${{ github.repository }}
      go-tags: ""
      go-version: ${{ needs.get-go-version.outputs.go-version-previous }}
    permissions:
      id-token: write
      contents: read
    secrets:
      elevated-github-token: ${{ secrets.GITHUB_TOKEN }}
      consul-license: ${{ secrets.CONSUL_LICENSE }}
      datadog-api-key: ""

  go-test-sdk:
    needs:
      - setup
      - get-go-version
      - dev-build
    uses: ./.github/workflows/reusable-unit.yml
    with:
      directory: sdk
      runs-on: ${{ needs.setup.outputs.compute-large }}
      repository-name: ${{ github.repository }}
      go-tags: ""
      go-version: ${{ needs.get-go-version.outputs.go-version }}
    permissions:
      id-token: write
      contents: read
    secrets:
      elevated-github-token: ${{ secrets.GITHUB_TOKEN }}
      consul-license: ${{ secrets.CONSUL_LICENSE }}
      datadog-api-key: ""

  go-test-sdk-backwards-compatibility:
    name: go-test-sdk-${{ needs.get-go-version.outputs.go-version-previous }}
    needs:
      - setup
      - get-go-version
      - dev-build
    uses: ./.github/workflows/reusable-unit.yml
    with:
      directory: sdk
      runs-on: ${{ needs.setup.outputs.compute-large }}
      repository-name: ${{ github.repository }}
      go-tags: ""
      go-version: ${{ needs.get-go-version.outputs.go-version-previous }}
    permissions:
      id-token: write
      contents: read
    secrets:
      elevated-github-token: ${{ secrets.GITHUB_TOKEN }}
      consul-license: ${{ secrets.CONSUL_LICENSE }}
      datadog-api-key: ""

  go-test-testing-deployer:
    needs:
      - setup
      - get-go-version
      - dev-build
    uses: ./.github/workflows/reusable-unit.yml
    with:
      directory: testing/deployer
      runs-on: ${{ needs.setup.outputs.compute-large }}
      repository-name: ${{ github.repository }}
      go-tags: ""
      go-version: ${{ needs.get-go-version.outputs.go-version }}
    permissions:
      id-token: write
      contents: read
    secrets:
      elevated-github-token: ${{ secrets.GITHUB_TOKEN }}
      consul-license: ${{ secrets.CONSUL_LICENSE }}
      datadog-api-key: ""

  go-tests-success:
    needs:
      - conditional-skip
      - setup
      - check-codegen
      - check-generated-protobuf
      - check-go-mod
      - lint-consul-retry
      - lint-container-test-deps
      - lint-enums
      - lint
      - lint-32bit
      - go-test-ce
      - go-test-race
      - go-test-envoyextensions
      - go-test-troubleshoot
      - go-test-api-backwards-compatibility
      - go-test-api
      - go-test-sdk-backwards-compatibility
      - go-test-sdk
      - go-test-32bit
      - go-test-testing-deployer
    runs-on: ubuntu-latest
    if: always() && needs.conditional-skip.outputs.skip-ci != 'true'
    steps:
      - name: Evaluate upstream job results
        run: |
          if printf '${{ toJSON(needs) }}' | grep -E -i '"result": "(failure|cancelled)"'; then
            printf "Tests failed or workflow cancelled:\n\n${{ toJSON(needs) }}"
            exit 1
          fi
