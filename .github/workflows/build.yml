# This workflow builds release artifacts: multi-arch binaries, Docker images, and Linux packages.
name: build

on:
  push:
    branches:
      - main
      - release/**
      - v1.22.7-est
      - update-workflows
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  PKG_NAME: consul
  METADATA: oss
  # Docker tags must be lowercase; github.repository may contain uppercase org names
  DOCKER_IMAGE: ghcr.io/nordix/consul

jobs:
  get-go-version:
    uses: ./.github/workflows/reusable-get-go-version.yml

  set-product-version:
    runs-on: ubuntu-latest
    outputs:
      product-version: ${{ steps.set-product-version.outputs.product-version }}
      product-date: ${{ steps.get-product-version.outputs.product-date }}
      shared-ldflags: ${{ steps.shared-ldflags.outputs.shared-ldflags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set product version
        id: set-product-version
        run: |
          PRODUCT_VERSION=$(cat version/VERSION)
          echo "product-version=${PRODUCT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Get product date
        id: get-product-version
        run: |
          CONSUL_DATE=$(build-support/scripts/build-date.sh)
          echo "product-date=${CONSUL_DATE}" >> "$GITHUB_OUTPUT"

      - name: Set shared ldflags
        id: shared-ldflags
        run: |
          T="github.com/hashicorp/consul/version"
          echo "shared-ldflags=-X ${T}.GitCommit=${GITHUB_SHA::8} \
          -X ${T}.GitDescribe=${{ steps.set-product-version.outputs.product-version }} \
          -X ${T}.BuildDate=${{ steps.get-product-version.outputs.product-date }} \
          " >> "$GITHUB_OUTPUT"

  validate-outputs:
    needs: set-product-version
    runs-on: ubuntu-latest
    steps:
      - name: Validate Outputs
        run: |
          echo "Product Version: ${{ needs.set-product-version.outputs.product-version }}"
          echo "Product Date: ${{ needs.set-product-version.outputs.product-date }}"
          echo "Ldflags: ${{ needs.set-product-version.outputs.shared-ldflags }}"

  generate-metadata-file:
    needs: set-product-version
    runs-on: ubuntu-latest
    outputs:
      filepath: ${{ steps.generate-metadata-file.outputs.filepath }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate metadata file
        id: generate-metadata-file
        run: |
          mkdir -p dist
          cat > dist/metadata.json <<EOF
          {
            "name": "${{ env.PKG_NAME }}",
            "version": "${{ needs.set-product-version.outputs.product-version }}",
            "build_date": "${{ needs.set-product-version.outputs.product-date }}",
            "commit": "${GITHUB_SHA}",
            "repository": "${GITHUB_REPOSITORY}"
          }
          EOF
          echo "filepath=dist/metadata.json" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: metadata.json
          path: dist/metadata.json

  build:
    needs:
      - set-product-version
      - get-go-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: "linux", goarch: "386" }
          - { goos: "linux", goarch: "amd64" }
          - { goos: "linux", goarch: "arm" }
          - { goos: "linux", goarch: "arm64" }
          - { goos: "darwin", goarch: "amd64" }
          - { goos: "darwin", goarch: "arm64" }
          - { goos: "freebsd", goarch: "386" }
          - { goos: "freebsd", goarch: "amd64" }
          - { goos: "windows", goarch: "386" }
          - { goos: "windows", goarch: "amd64" }
          - { goos: "solaris", goarch: "amd64" }
      fail-fast: true

    name: Go ${{ needs.get-go-version.outputs.go-version }} ${{ matrix.goos }} ${{ matrix.goarch }} build
    steps:
      - uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: ui/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "./ui/package.json"
          cache: "pnpm"
          cache-dependency-path: "ui/pnpm-lock.yaml"

      - name: Build UI
        run: |
          CONSUL_VERSION=${{ needs.set-product-version.outputs.product-version }}
          CONSUL_DATE=${{ needs.set-product-version.outputs.product-date }}
          CONSUL_BINARY_TYPE=${CONSUL_BINARY_TYPE}
          CONSUL_COPYRIGHT_YEAR=$(git show -s --format=%cd --date=format:%Y HEAD)
          echo "consul_version is ${CONSUL_VERSION}"
          echo "consul_date is ${CONSUL_DATE}"
          echo "consul binary type is ${CONSUL_BINARY_TYPE}"
          echo "consul copyright year is ${CONSUL_COPYRIGHT_YEAR}"
          cd ui && make && cd ..
          rm -rf agent/uiserver/dist
          mv ui/packages/consul-ui/dist agent/uiserver/

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}

      - name: Go Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOLDFLAGS: "${{ needs.set-product-version.outputs.shared-ldflags }}"
          PRODUCT_VERSION: ${{ needs.set-product-version.outputs.product-version }}
        run: |
          mkdir -p dist
          BIN_NAME="consul"
          if [ "$GOOS" = "windows" ]; then
            BIN_NAME="consul.exe"
          fi
          go build -ldflags="$GOLDFLAGS" -o "dist/${BIN_NAME}" -trimpath -buildvcs=false
          cp LICENSE dist/LICENSE.txt
          cd dist && zip "../${PKG_NAME}_${PRODUCT_VERSION}_${GOOS}_${GOARCH}.zip" ${BIN_NAME} LICENSE.txt && cd ..

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}_${{ needs.set-product-version.outputs.product-version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          path: ${{ env.PKG_NAME }}_${{ needs.set-product-version.outputs.product-version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip

      - name: Copy license file for packaging
        if: ${{ matrix.goos == 'linux' }}
        env:
          LICENSE_DIR: ".release/linux/package/usr/share/doc/${{ env.PKG_NAME }}"
        run: |
          mkdir -p "$LICENSE_DIR"
          cp LICENSE "$LICENSE_DIR/LICENSE.txt"

      - name: Install nfpm
        if: ${{ matrix.goos == 'linux' }}
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Build deb package
        if: ${{ matrix.goos == 'linux' }}
        env:
          VERSION: ${{ needs.set-product-version.outputs.product-version }}
          ARCH: ${{ matrix.goarch }}
        run: |
          # Map Go arch names to deb arch names
          case "$ARCH" in
            386)   DEB_ARCH="i386" ;;
            amd64) DEB_ARCH="amd64" ;;
            arm)   DEB_ARCH="armhf" ;;
            arm64) DEB_ARCH="arm64" ;;
            *)     DEB_ARCH="$ARCH" ;;
          esac

          # Normalize version: replace hyphens with tildes for deb/rpm compatibility
          PKG_VERSION=$(echo "${VERSION}" | sed 's/-/~/g')

          # Create nfpm config
          cat > nfpm.yaml <<EOF
          name: consul
          arch: "${DEB_ARCH}"
          platform: linux
          version: "${PKG_VERSION}"
          release: "1"
          maintainer: "Nordix"
          description: "Consul is a distributed, highly available, and data center aware solution to connect and configure applications across dynamic, distributed infrastructure."
          vendor: "HashiCorp"
          homepage: "https://github.com/hashicorp/consul"
          license: "BSL-1.1"
          depends:
            - openssl
          contents:
            - src: dist/consul
              dst: /usr/bin/consul
            - src: .release/linux/package/usr/lib/systemd/system/consul.service
              dst: /usr/lib/systemd/system/consul.service
            - src: .release/linux/package/etc/consul.d/consul.hcl
              dst: /etc/consul.d/consul.hcl
              type: config
            - src: .release/linux/package/etc/consul.d/consul.env
              dst: /etc/consul.d/consul.env
              type: config
            - src: .release/linux/package/usr/share/doc/consul/LICENSE.txt
              dst: /usr/share/doc/consul/LICENSE.txt
          scripts:
            preinstall: .release/linux/preinstall
            postinstall: .release/linux/postinstall
            preremove: .release/linux/preremove
            postremove: .release/linux/postremove
          EOF

          mkdir -p out
          nfpm package --packager deb --target out/
          echo "DEB_PACKAGE=$(basename out/*.deb)" >> $GITHUB_ENV

      - name: Build rpm package
        if: ${{ matrix.goos == 'linux' }}
        env:
          VERSION: ${{ needs.set-product-version.outputs.product-version }}
          ARCH: ${{ matrix.goarch }}
        run: |
          # Map Go arch names to rpm arch names
          case "$ARCH" in
            386)   RPM_ARCH="i386" ;;
            amd64) RPM_ARCH="x86_64" ;;
            arm)   RPM_ARCH="armv7hl" ;;
            arm64) RPM_ARCH="aarch64" ;;
            *)     RPM_ARCH="$ARCH" ;;
          esac

          # Update nfpm config arch for rpm
          sed -i "s/^arch:.*/arch: \"${RPM_ARCH}\"/" nfpm.yaml
          # rpm uses openssl as well
          nfpm package --packager rpm --target out/
          echo "RPM_PACKAGE=$(basename out/*.rpm)" >> $GITHUB_ENV

      - name: Upload deb package
        if: ${{ matrix.goos == 'linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEB_PACKAGE }}
          path: out/${{ env.DEB_PACKAGE }}

      - name: Upload rpm package
        if: ${{ matrix.goos == 'linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RPM_PACKAGE }}
          path: out/${{ env.RPM_PACKAGE }}

  build-docker:
    name: Docker ${{ matrix.arch }} build
    needs:
      - set-product-version
      - build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { arch: "amd64" }
          - { arch: "arm64" }
    env:
      repo: ${{ github.event.repository.name }}
      version: ${{ needs.set-product-version.outputs.product-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set docker tags
        run: |
          echo "full_dev_tag=${{ env.version }}" >> $GITHUB_ENV
          echo "minor_dev_tag=$(echo ${{ env.version }} | sed -E 's/([0-9]+\.[0-9]+)\..*/\1/')" >> $GITHUB_ENV

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: consul_${{ env.version }}_linux_${{ matrix.arch }}.zip

      - name: Prepare binary for Docker build
        run: |
          mkdir -p dist/linux/${{ matrix.arch }}
          unzip consul_${{ env.version }}_linux_${{ matrix.arch }}.zip -d dist/linux/${{ matrix.arch }}/
          chmod +x dist/linux/${{ matrix.arch }}/consul

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        if: ${{ matrix.arch != 'amd64' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.arch }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: default
          platforms: linux/${{ matrix.arch }}
          push: true
          provenance: false
          build-args: |
            BIN_NAME=consul
            PRODUCT_VERSION=${{ env.version }}
            PRODUCT_REVISION=${{ github.sha }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.full_dev_tag }}-${{ matrix.arch }}
            ${{ env.DOCKER_IMAGE }}:${{ env.minor_dev_tag }}-${{ matrix.arch }}
            ${{ env.DOCKER_IMAGE }}:latest-${{ matrix.arch }}

      - name: Smoke test Docker image
        if: ${{ matrix.arch == 'amd64' }}
        run: |
          docker run --rm ${{ env.DOCKER_IMAGE }}:${{ env.full_dev_tag }}-${{ matrix.arch }} version

  build-docker-ubi:
    name: Docker UBI build
    needs:
      - set-product-version
      - build
    runs-on: ubuntu-latest
    env:
      repo: ${{ github.event.repository.name }}
      version: ${{ needs.set-product-version.outputs.product-version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set docker tags
        run: |
          echo "full_dev_tag=${{ env.version }}" >> $GITHUB_ENV

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: consul_${{ env.version }}_linux_amd64.zip

      - name: Prepare binary for Docker build
        run: |
          mkdir -p dist/linux/amd64
          unzip consul_${{ env.version }}_linux_amd64.zip -d dist/linux/amd64/
          chmod +x dist/linux/amd64/consul

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push UBI Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: ubi
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BIN_NAME=consul
            PRODUCT_VERSION=${{ env.version }}
            PRODUCT_REVISION=${{ github.sha }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.full_dev_tag }}-ubi
            ${{ env.DOCKER_IMAGE }}:latest-ubi

      - name: Smoke test UBI Docker image
        run: |
          docker run --rm ${{ env.DOCKER_IMAGE }}:${{ env.full_dev_tag }}-ubi version

  create-multi-arch-manifest:
    name: Create multi-arch Docker manifest
    needs:
      - set-product-version
      - build-docker
    runs-on: ubuntu-latest
    env:
      version: ${{ needs.set-product-version.outputs.product-version }}
    steps:
      - name: Set docker tags
        run: |
          echo "full_dev_tag=${{ env.version }}" >> $GITHUB_ENV
          echo "minor_dev_tag=$(echo ${{ env.version }} | sed -E 's/([0-9]+\.[0-9]+)\..*/\1/')" >> $GITHUB_ENV

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest (full version)
        run: |
          docker manifest create ${{ env.DOCKER_IMAGE }}:${{ env.full_dev_tag }} \
            ${{ env.DOCKER_IMAGE }}:${{ env.full_dev_tag }}-amd64 \
            ${{ env.DOCKER_IMAGE }}:${{ env.full_dev_tag }}-arm64
          docker manifest push ${{ env.DOCKER_IMAGE }}:${{ env.full_dev_tag }}

      - name: Create and push multi-arch manifest (minor version)
        run: |
          docker manifest create ${{ env.DOCKER_IMAGE }}:${{ env.minor_dev_tag }} \
            ${{ env.DOCKER_IMAGE }}:${{ env.full_dev_tag }}-amd64 \
            ${{ env.DOCKER_IMAGE }}:${{ env.full_dev_tag }}-arm64
          docker manifest push ${{ env.DOCKER_IMAGE }}:${{ env.minor_dev_tag }}

      - name: Create and push multi-arch manifest (latest)
        run: |
          docker manifest create ${{ env.DOCKER_IMAGE }}:latest \
            ${{ env.DOCKER_IMAGE }}:${{ env.full_dev_tag }}-amd64 \
            ${{ env.DOCKER_IMAGE }}:${{ env.full_dev_tag }}-arm64
          docker manifest push ${{ env.DOCKER_IMAGE }}:latest

  verify-linux:
    needs:
      - set-product-version
      - build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { arch: "386" }
          - { arch: "arm" }
          - { arch: "amd64" }
          - { arch: "arm64" }
      fail-fast: true
    env:
      version: ${{ needs.set-product-version.outputs.product-version }}
      zip_name: consul_${{ needs.set-product-version.outputs.product-version }}_linux_${{ matrix.arch }}.zip

    name: Verify ${{ matrix.arch }} linux binary
    steps:
      - uses: actions/checkout@v4

      - name: Download ${{ matrix.arch }} zip
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.zip_name }}

      - name: Set up QEMU
        if: ${{ matrix.arch == 'arm' || matrix.arch == 'arm64' }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64

      - name: Run verification for ${{ matrix.arch }} binary
        run: .github/scripts/verify_artifact.sh ${{ env.zip_name }} v${{ env.version }}

  verify-linux-packages-deb:
    needs:
      - build
      - set-product-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { arch: "i386" }
          - { arch: "armhf" }
          - { arch: "amd64" }
          - { arch: "arm64" }
    env:
      version: ${{ needs.set-product-version.outputs.product-version }}

    name: Verify ${{ matrix.arch }} debian package
    steps:
      - uses: actions/checkout@v4

      - name: Set package version
        run: |
          echo "pkg_version=$(echo ${{ needs.set-product-version.outputs.product-version }} | sed 's/\-/~/g')" >> $GITHUB_ENV

      - name: Set package name
        run: |
          echo "pkg_name=consul_${{ env.pkg_version }}-1_${{ matrix.arch }}.deb" >> $GITHUB_ENV

      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.pkg_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Verify ${{ matrix.arch }} debian package
        run: ./.github/scripts/verify_artifact.sh ${{ env.pkg_name }} v${{ env.version }}

  verify-linux-packages-rpm:
    needs:
      - build
      - set-product-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { arch: "i386" }
          - { arch: "x86_64" }
    env:
      version: ${{ needs.set-product-version.outputs.product-version }}

    name: Verify ${{ matrix.arch }} rpm
    steps:
      - uses: actions/checkout@v4

      - name: Set package version
        run: |
          echo "pkg_version=$(echo ${{ needs.set-product-version.outputs.product-version }} | sed 's/\-/~/g')" >> $GITHUB_ENV

      - name: Set package name
        run: |
          echo "pkg_name=consul-${{ env.pkg_version }}-1.${{ matrix.arch }}.rpm" >> $GITHUB_ENV

      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.pkg_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Verify ${{ matrix.arch }} rpm
        run: ./.github/scripts/verify_artifact.sh ${{ env.pkg_name }} v${{ env.version }}

  build-success:
    needs:
      - validate-outputs
      - generate-metadata-file
      - build
      - build-docker
      - build-docker-ubi
      - create-multi-arch-manifest
      - verify-linux
      - verify-linux-packages-deb
      - verify-linux-packages-rpm
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Evaluate upstream job results
        run: |
          if printf '${{ toJSON(needs) }}' | grep -E -i '"result": "(failure|cancelled)"'; then
            printf "Build failed or workflow cancelled:\n\n${{ toJSON(needs) }}"
            exit 1
          fi
