# This workflow builds Consul binaries on multiple architectures for PRs.
# It verifies new commits don't introduce any breaking build changes.
name: build-distros

on:
  pull_request:
  push:
    branches:
      - main
      - release/**
      - v1.22.7-est
      - update-workflows

permissions:
  contents: read

env:
  GOTAGS: ""

concurrency:
  group: build-distros-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  get-go-version:
    uses: ./.github/workflows/reusable-get-go-version.yml

  check-go-mod:
    needs:
      - get-go-version
    uses: ./.github/workflows/reusable-check-go-mod.yml
    with:
      runs-on: '"ubuntu-latest"'
      repository-name: ${{ github.repository }}
      go-version: ${{ needs.get-go-version.outputs.go-version }}
    secrets:
      elevated-github-token: ${{ secrets.GITHUB_TOKEN }}

  build-386:
    needs:
      - get-go-version
      - check-go-mod
    env:
      XC_OS: "freebsd linux windows"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}

      - name: Build
        run: |
          for os in $XC_OS; do
            GOOS="$os" GOARCH=386 CGO_ENABLED=0 go build -tags "${{ env.GOTAGS }}"
          done

  build-amd64:
    needs:
      - get-go-version
      - check-go-mod
    env:
      XC_OS: "darwin freebsd linux solaris windows"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}

      - name: Build
        run: |
          for os in $XC_OS; do
            GOOS="$os" GOARCH=amd64 CGO_ENABLED=0 go build -tags "${{ env.GOTAGS }}"
          done

  build-arm:
    needs:
      - get-go-version
      - check-go-mod
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1
      GOOS: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.get-go-version.outputs.go-version }}

      - name: Install cross-compilers
        run: |
          sudo apt-get update --allow-releaseinfo-change-suite --allow-releaseinfo-change-version && sudo apt-get install -y gcc-arm-linux-gnueabi gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu

      - run: CC=arm-linux-gnueabi-gcc GOARCH=arm GOARM=5 go build -tags "${{ env.GOTAGS }}"
      - run: CC=arm-linux-gnueabihf-gcc GOARCH=arm GOARM=6 go build -tags "${{ env.GOTAGS }}"
      - run: CC=aarch64-linux-gnu-gcc GOARCH=arm64 go build -tags "${{ env.GOTAGS }}"

  build-distros-success:
    needs:
      - check-go-mod
      - build-386
      - build-amd64
      - build-arm
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - name: Evaluate upstream job results
        run: |
          if printf '${{ toJSON(needs) }}' | grep -E -i '"result": "(failure|cancelled)"'; then
            printf "Tests failed or workflow cancelled:\n\n${{ toJSON(needs) }}"
            exit 1
          fi
